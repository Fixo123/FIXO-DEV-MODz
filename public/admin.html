<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - FIXO DEV MODz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0a0a14;
      color: #e0e0e0;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #6c63ff; border-radius: 10px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(10,10,20,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #2a2a4a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b6b, #6c63ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo i { font-size: 2rem; -webkit-text-fill-color: #6c63ff; }

    .btn-logout {
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-logout:hover { background: #ff6b6b; color: #fff; }

    .admin-login {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: #14142a;
      border-radius: 20px;
      border: 1px solid #2a2a4a;
      text-align: center;
    }
    .admin-login h2 { margin-bottom: 1.5rem; }
    .admin-login input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 30px;
      border: 1px solid #3a3a5a;
      background: #1a1a2e;
      color: #fff;
      outline: none;
    }
    .admin-login button {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 30px;
      background: #6c63ff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .admin-login button:hover { background: #5a52d5; }
    .error { color: #ff6b6b; margin-top: 0.5rem; }

    #adminDashboard { padding: 2rem; }
    .add-app, .manage-apps {
      background: #14142a;
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid #2a2a4a;
      margin-bottom: 2rem;
    }
    .add-app h2, .manage-apps h2 { margin-bottom: 1rem; }
    .add-app form {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .add-app input, .add-app textarea {
      padding: 0.8rem;
      border-radius: 10px;
      border: 1px solid #3a3a5a;
      background: #1a1a2e;
      color: #fff;
      outline: none;
    }
    .add-app textarea { min-height: 80px; resize: vertical; }
    .add-app button {
      padding: 0.8rem;
      border: none;
      border-radius: 30px;
      background: #6c63ff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .add-app button:hover { background: #5a52d5; }

    .admin-app-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a2e;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      margin-bottom: 0.5rem;
      border-left: 4px solid #6c63ff;
    }
    .admin-app-item .info { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .admin-app-item .info strong { color: #fff; }
    .admin-app-item .delete-btn {
      background: #ff6b6b;
      border: none;
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    .admin-app-item .delete-btn:hover { background: #e05555; }

    @media (max-width: 600px) {
      .admin-app-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-shield-alt"></i><span>Admin Panel</span></div>
    <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </header>

  <div id="loginForm" class="admin-login">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter password" />
    <button id="loginBtn">Login</button>
    <p id="loginError" class="error"></p>
  </div>

  <div id="adminDashboard" style="display:none;">
    <section class="add-app">
      <h2><i class="fas fa-plus-circle"></i> Add New Mod</h2>
      <form id="addAppForm">
        <input type="text" id="appName" placeholder="App Name" required />
        <input type="text" id="appVersion" placeholder="Version (e.g. 2.0.1)" required />
        <textarea id="appDescription" placeholder="Description" required></textarea>
        <input type="url" id="appDownloadUrl" placeholder="Download URL" required />
        <input type="url" id="appImageUrl" placeholder="Image URL (logo/screenshot)" required />
        <input type="text" id="appCategory" placeholder="Category (e.g. Games, Tools)" required />
        <button type="submit"><i class="fas fa-upload"></i> Add App</button>
      </form>
    </section>

    <section class="manage-apps">
      <h2><i class="fas fa-list"></i> Manage Apps</h2>
      <div id="adminAppsList"></div>
    </section>
  </div>

  <script>
    const API_BASE = '/api';

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const dashboard = document.getElementById('adminDashboard');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const adminPass = document.getElementById('adminPassword');
      const loginError = document.getElementById('loginError');

      const isLoggedIn = localStorage.getItem('adminToken') === 'oshan123#';
      if (isLoggedIn) {
        loginForm.style.display = 'none';
        dashboard.style.display = 'block';
        loadAdminApps();
      } else {
        loginForm.style.display = 'block';
        dashboard.style.display = 'none';
      }

      loginBtn.addEventListener('click', async () => {
        const password = adminPass.value.trim();
        if (!password) { loginError.textContent = 'Please enter password.'; return; }
        try {
          const res = await fetch(`${API_BASE}/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('adminToken', 'oshan123#');
            loginForm.style.display = 'none';
            dashboard.style.display = 'block';
            loadAdminApps();
            loginError.textContent = '';
          } else {
            loginError.textContent = 'Incorrect password.';
          }
        } catch (err) {
          loginError.textContent = 'Server error. Try again.';
        }
      });

      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('adminToken');
        loginForm.style.display = 'block';
        dashboard.style.display = 'none';
        adminPass.value = '';
        loginError.textContent = '';
      });

      document.getElementById('addAppForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('appName').value.trim();
        const version = document.getElementById('appVersion').value.trim();
        const description = document.getElementById('appDescription').value.trim();
        const downloadUrl = document.getElementById('appDownloadUrl').value.trim();
        const imageUrl = document.getElementById('appImageUrl').value.trim();
        const category = document.getElementById('appCategory').value.trim();

        if (!name || !version || !description || !downloadUrl || !imageUrl || !category) {
          alert('Please fill all fields.');
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/apps`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-admin-token': 'oshan123#'
            },
            body: JSON.stringify({ name, version, description, downloadUrl, imageUrl, category })
          });
          const data = await res.json();
          if (data.success) {
            alert('App added successfully!');
            document.getElementById('addAppForm').reset();
            loadAdminApps();
          } else {
            alert('Failed to add app: ' + (data.message || 'Unknown error'));
          }
        } catch (err) {
          alert('Error adding app.');
        }
      });
    });

    async function loadAdminApps() {
      try {
        const res = await fetch(`${API_BASE}/apps`);
        const apps = await res.json();
        const container = document.getElementById('adminAppsList');
        if (!container) return;
        if (apps.length === 0) {
          container.innerHTML = '<p style="color:#888;">No apps added yet.</p>';
          return;
        }
        container.innerHTML = apps.map(app => `
          <div class="admin-app-item" data-id="${app._id}">
            <div class="info">
              <strong>${app.name}</strong>
              <span>v${app.version}</span>
              <span>${app.category || 'General'}</span>
            </div>
            <button class="delete-btn" data-id="${app._id}"><i class="fas fa-trash"></i> Delete</button>
          </div>
        `).join('');

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id');
            if (confirm('Delete this app?')) {
              try {
                const res = await fetch(`${API_BASE}/apps/${id}`, {
                  method: 'DELETE',
                  headers: { 'x-admin-token': 'oshan123#' }
                });
                const data = await res.json();
                if (data.success) {
                  alert('Deleted successfully.');
                  loadAdminApps();
                } else {
                  alert('Delete failed.');
                }
              } catch (err) {
                alert('Error deleting.');
              }
            }
          });
        });
      } catch (err) {
        console.error('Error loading admin apps:', err);
      }
    }
  </script>
</body>
</html>
