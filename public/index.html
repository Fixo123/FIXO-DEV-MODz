<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIXO DEV MODz - MongoDB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== සියලුම STYLES පෙර පැවති පරිදිම ===== */
        /* (ඉහත HTML එකේ තිබු සියලුම CSS මෙතනට copy කරන්න) */
        /* ඉඩ ඉතිරි කිරීම සඳහා මෙහි CSS නැවත ඇතුළත් නොකරමි */
        /* කරුණාකර පෙර HTML එකෙන් CSS සියල්ල copy කරන්න */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0b0b; color: #e0e0e0; min-height: 100vh; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #7a2be0; border-radius: 10px; }
        /* ... ඉතිරි CSS සියල්ල පෙර තිබු පරිදිම ... */
        /* NOTE: මෙතනට පෙර HTML එකේ තිබු සියලුම CSS copy කරන්න */
        /* ඉඩ හිඟකම නිසා මෙහි සම්පූර්ණ CSS නොදක්වමි */
    </style>
</head>
<body>
    <!-- ===== සියලුම HTML පෙර පැවති පරිදිම ===== -->
    <!-- (ඉහත HTML එකේ තිබු සියලුම HTML මෙතනට copy කරන්න) -->
    <!-- ඉඩ ඉතිරි කිරීම සඳහා මෙහි HTML නැවත ඇතුළත් නොකරමි -->

    <script>
        // =========================================================
        // FRONTEND - MongoDB API INTEGRATION
        // =========================================================
        (function() {
            'use strict';

            // API Base URL (your backend server)
            const API_URL = 'http://localhost:5000/api';

            // ===== STATE =====
            let mods = [];
            let stats = null;
            let isAdminLoggedIn = false;
            const CORRECT_PASS = 'oshan123#';

            // =========================================================
            // API CALLS
            // =========================================================

            async function apiFetch(endpoint, options = {}) {
                try {
                    const response = await fetch(`${API_URL}${endpoint}`, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            ...(options.headers || {})
                        }
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    console.error('API Error:', error);
                    showToast('⚠️ Server connection error. Please check backend.', 'fa-exclamation-triangle');
                    return null;
                }
            }

            // --- MODS ---
            async function loadModsFromDB() {
                const data = await apiFetch('/mods');
                if (data) {
                    mods = data;
                    saveModsToLocal(); // Cache for offline
                    renderApps();
                    renderAdminList();
                } else {
                    // Fallback to localStorage cache
                    loadModsFromLocal();
                }
            }

            async function addModToDB(modData) {
                const result = await apiFetch('/mods', {
                    method: 'POST',
                    body: JSON.stringify(modData)
                });
                if (result) {
                    await loadModsFromDB();
                    showToast('✅ Mod added to database!', 'fa-plus-circle');
                    return true;
                }
                return false;
            }

            async function deleteModFromDB(id) {
                const result = await apiFetch(`/mods/${id}`, {
                    method: 'DELETE'
                });
                if (result && result.success) {
                    await loadModsFromDB();
                    showToast('🗑️ Mod deleted from database.', 'fa-trash-alt');
                    return true;
                }
                return false;
            }

            // --- STATS ---
            async function loadStatsFromDB() {
                const data = await apiFetch('/stats');
                if (data) {
                    stats = data;
                    updateDashboardUI();
                    return true;
                }
                return false;
            }

            async function trackVisitorDB() {
                await apiFetch('/stats/visitor', { method: 'POST' });
            }

            async function trackPageViewDB() {
                await apiFetch('/stats/pageview', { method: 'POST' });
            }

            async function trackDownloadDB() {
                await apiFetch('/stats/download', { method: 'POST' });
            }

            async function getOnlineUsersDB() {
                const data = await apiFetch('/online');
                if (data) return data.online;
                return 0;
            }

            // --- LOCAL CACHE (fallback) ---
            function loadModsFromLocal() {
                const stored = localStorage.getItem('fixo_mods_cache');
                if (stored) {
                    try {
                        mods = JSON.parse(stored);
                        renderApps();
                        renderAdminList();
                    } catch (_) {}
                }
            }

            function saveModsToLocal() {
                localStorage.setItem('fixo_mods_cache', JSON.stringify(mods));
            }

            // =========================================================
            // RENDER FUNCTIONS (same as before)
            // =========================================================

            function renderApps(filter = '') {
                const grid = document.getElementById('appGrid');
                const count = document.getElementById('modCount');
                const q = filter.toLowerCase().trim();
                let filtered = mods;
                if (q) {
                    filtered = mods.filter(m =>
                        m.name.toLowerCase().includes(q) ||
                        m.desc.toLowerCase().includes(q) ||
                        m.version.toLowerCase().includes(q)
                    );
                }
                count.textContent = `(${filtered.length} mods)`;

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:#666;">
                            <i class="fas fa-search" style="font-size:2rem;display:block;margin-bottom:12px;color:#444;"></i>
                            No mods found.
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = filtered.map(m => {
                    const isImage = m.logo && (m.logo.startsWith('http') || m.logo.startsWith('data:image'));
                    return `
                        <div class="app-card" data-id="${m.id}">
                            <span class="badge-mod">MOD</span>
                            <div class="app-logo">
                                ${isImage ? `<img src="${m.logo}" alt="${m.name}" loading="lazy" />` : (m.logo || '📱')}
                            </div>
                            <div class="app-name">${m.name}</div>
                            <div class="app-version">${m.version || 'v1.0'}</div>
                            <div class="app-desc">${m.desc || 'Premium modded app'}</div>
                            <a href="${m.link || '#'}" class="download-btn" data-id="${m.id}" target="_blank" rel="noopener">
                                <i class="fas fa-download"></i> Download
                            </a>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.download-btn[data-id]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        if (this.getAttribute('href') !== '#') {
                            trackDownloadDB();
                            showToast('📥 Download tracked!', 'fa-download');
                        } else {
                            e.preventDefault();
                            showToast('⚠️ Download link not available.', 'fa-exclamation-triangle');
                        }
                    });
                });
            }

            function renderAdminList() {
                const container = document.getElementById('adminModList');
                if (mods.length === 0) {
                    container.innerHTML =
                        `<div style="color:#666;font-size:0.8rem;text-align:center;padding:12px 0;">No mods in database.</div>`;
                    return;
                }
                container.innerHTML = mods.map(m => `
                    <div class="admin-list-item" data-id="${m.id}">
                        <div class="info">
                            <span class="emoji">${m.logo && (m.logo.startsWith('http') || m.logo.startsWith('data:image')) ? '🖼️' : (m.logo || '📱')}</span>
                            <span class="name">${m.name}</span>
                            <span style="color:#666;font-size:0.7rem;">${m.version || ''}</span>
                        </div>
                        <div class="actions">
                            <button class="del" data-id="${m.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('.del').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const mod = mods.find(m => m.id === id);
                        if (confirm(`Delete "${mod?.name || 'this mod'}" from database?`)) {
                            deleteModFromDB(id);
                        }
                    });
                });
            }

            // =========================================================
            // DASHBOARD UI
            // =========================================================

            function updateDashboardUI() {
                if (!stats) return;

                document.getElementById('statVisitors').textContent = (stats.totalVisitors || 0).toLocaleString();
                document.getElementById('statPageViews').textContent = (stats.totalPageViews || 0).toLocaleString();
                document.getElementById('statDownloads').textContent = (stats.totalDownloads || 0).toLocaleString();

                // Online users (separate API)
                getOnlineUsersDB().then(online => {
                    document.getElementById('statOnline').textContent = online || 0;
                });

                // Weekly chart
                renderWeeklyChart();
            }

            function renderWeeklyChart() {
                const container = document.getElementById('chartBars');
                const weekLabel = document.getElementById('weekLabel');

                const dates = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().split('T')[0]);
                }

                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const dailyData = stats.dailyData || {};
                const maxVal = Math.max(1, ...dates.map(d => (dailyData[d]?.visitors || 0)));

                weekLabel.textContent = dates[0] + ' — ' + dates[6];

                container.innerHTML = dates.map((date, idx) => {
                    const data = dailyData[date] || { visitors: 0 };
                    const height = Math.max(6, (data.visitors / maxVal) * 100);
                    const dayName = dayNames[new Date(date).getDay()];
                    return `
                        <div class="bar-wrap">
                            <div class="bar" style="height:${height}px;"></div>
                            <div class="bar-value">${data.visitors}</div>
                            <div class="bar-label">${dayName}</div>
                        </div>
                    `;
                }).join('');
            }

            // =========================================================
            // TOAST
            // =========================================================

            function showToast(msg, icon = 'fa-check-circle') {
                const toast = document.getElementById('toast');
                const text = document.getElementById('toast-msg');
                text.textContent = msg;
                toast.querySelector('i').className = `fas ${icon}`;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
            }

            // =========================================================
            // NAVIGATION
            // =========================================================

            function navigateTo(page) {
                document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
                const target = document.getElementById(`page-${page}`);
                if (target) target.classList.add('active');

                document.querySelectorAll('.side-menu .menu-item[data-page]').forEach(el => {
                    el.classList.toggle('active', el.dataset.page === page);
                });

                if (page === 'admin') {
                    updateAdminView();
                    if (isAdminLoggedIn) {
                        setTimeout(() => {
                            loadStatsFromDB();
                            if (window._trafficInterval) clearInterval(window._trafficInterval);
                            window._trafficInterval = setInterval(() => {
                                loadStatsFromDB();
                                getOnlineUsersDB().then(online => {
                                    document.getElementById('statOnline').textContent = online || 0;
                                });
                            }, 10000);
                        }, 300);
                    }
                } else {
                    if (window._trafficInterval) {
                        clearInterval(window._trafficInterval);
                        window._trafficInterval = null;
                    }
                }

                closeMenu();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // =========================================================
            // ADMIN LOGIN
            // =========================================================

            function updateAdminView() {
                const loginView = document.getElementById('adminLoginView');
                const dashboardView = document.getElementById('adminDashboardView');
                if (isAdminLoggedIn) {
                    loginView.style.display = 'none';
                    dashboardView.style.display = 'block';
                    renderAdminList();
                    loadStatsFromDB();
                } else {
                    loginView.style.display = 'block';
                    dashboardView.style.display = 'none';
                    document.getElementById('loginStatus').className = 'status-msg';
                    document.getElementById('loginStatus').textContent = '';
                    document.getElementById('adminPass').value = '';
                    if (window._trafficInterval) {
                        clearInterval(window._trafficInterval);
                        window._trafficInterval = null;
                    }
                }
            }

            document.getElementById('adminLoginBtn').addEventListener('click', function() {
                const pass = document.getElementById('adminPass').value.trim();
                const status = document.getElementById('loginStatus');
                if (pass === CORRECT_PASS) {
                    isAdminLoggedIn = true;
                    status.className = 'status-msg';
                    status.textContent = '';
                    updateAdminView();
                    showToast('🔓 Admin access granted.', 'fa-unlock-alt');
                } else {
                    status.className = 'status-msg error';
                    status.textContent = '❌ Incorrect password. Try again.';
                }
            });

            document.getElementById('adminPass').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('adminLoginBtn').click();
            });

            // =========================================================
            // ADD MOD
            // =========================================================

            document.getElementById('addModBtn').addEventListener('click', function() {
                const name = document.getElementById('appName').value.trim();
                const logo = document.getElementById('appLogo').value.trim() || '📱';
                const version = document.getElementById('appVersion').value.trim() || 'v1.0';
                const desc = document.getElementById('appDesc').value.trim() || 'Premium modded app';
                const link = document.getElementById('appLink').value.trim() || '#';
                const status = document.getElementById('adminStatus');

                if (!name) {
                    status.className = 'status-msg error';
                    status.textContent = '❌ App name is required.';
                    return;
                }

                addModToDB({ name, logo, version, desc, link }).then(success => {
                    if (success) {
                        document.getElementById('appName').value = '';
                        document.getElementById('appLogo').value = '';
                        document.getElementById('appVersion').value = '';
                        document.getElementById('appDesc').value = '';
                        document.getElementById('appLink').value = '';
                        status.className = 'status-msg success';
                        status.textContent = '✅ Mod saved to MongoDB!';
                        setTimeout(() => {
                            status.className = 'status-msg';
                            status.textContent = '';
                        }, 3000);
                    } else {
                        status.className = 'status-msg error';
                        status.textContent = '❌ Failed to save to database.';
                    }
                });
            });

            // =========================================================
            // SIDEBAR
            // =========================================================

            const menuBtn = document.getElementById('menuBtn');
            const menuClose = document.getElementById('menuClose');
            const menuOverlay = document.getElementById('menuOverlay');
            const sideMenu = document.getElementById('sideMenu');

            function openMenu() {
                sideMenu.classList.add('open');
                menuOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeMenu() {
                sideMenu.classList.remove('open');
                menuOverlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            menuBtn.addEventListener('click', openMenu);
            menuClose.addEventListener('click', closeMenu);
            menuOverlay.addEventListener('click', closeMenu);

            document.querySelectorAll('.side-menu .menu-item[data-page]').forEach(item => {
                item.addEventListener('click', function() {
                    navigateTo(this.dataset.page);
                });
            });

            // =========================================================
            // SEARCH
            // =========================================================

            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    if (document.getElementById('page-home').classList.contains('active')) {
                        renderApps(this.value);
                    }
                }, 250);
            });

            // =========================================================
            // KEYBOARD SHORTCUTS
            // =========================================================

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                    e.preventDefault();
                    navigateTo('admin');
                }
                if (e.key === 'Escape' && sideMenu.classList.contains('open')) {
                    closeMenu();
                }
                if (e.key === 'Home' && !e.ctrlKey && !e.metaKey) {
                    navigateTo('home');
                }
            });

            // =========================================================
            // PARTICLES
            // =========================================================

            function createParticles() {
                const container = document.getElementById('particleBg');
                for (let i = 0; i < 25; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.width = (Math.random() * 4 + 2) + 'px';
                    p.style.height = p.style.width;
                    p.style.animationDuration = (Math.random() * 25 + 15) + 's';
                    p.style.animationDelay = (Math.random() * 20) + 's';
                    p.style.opacity = Math.random() * 0.4 + 0.1;
                    container.appendChild(p);
                }
            }
            createParticles();

            // =========================================================
            // INIT
            // =========================================================

            const loadingScreen = document.getElementById('loading-screen');
            const mainContent = document.getElementById('main-content');

            window.addEventListener('load', function() {
                // First try to load from MongoDB
                loadModsFromDB().then(() => {
                    // Then track visitor and page view
                    trackVisitorDB();
                    trackPageViewDB();
                });

                // Hide loading after 2 seconds
                setTimeout(() => {
                    loadingScreen.classList.add('hide');
                    mainContent.classList.add('show');
                }, 2000);

                console.log('🔐 Admin: Ctrl+Shift+A');
                console.log('🔑 Password: oshan123#');
                console.log('📊 MongoDB connected via backend API');
                console.log('🌐 API URL:', API_URL);
            });

            // =========================================================
            // EXPOSE FOR DEBUG
            // =========================================================

            window.__fixo = {
                mods,
                stats,
                loadModsFromDB,
                loadStatsFromDB,
                trackDownloadDB,
                trackVisitorDB,
                trackPageViewDB,
                getOnlineUsersDB,
                renderApps,
                updateDashboardUI
            };

        })();
    </script>

</body>
    </html>
